[project]
name = "skillbridge-ai"
version = "2.0.0"
description = "Career exploration desktop app with a FastAPI backend, official O*NET data, and consent-based community knowledge."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.pyright]
include = ["apps", "packages", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", ".venv-*"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/backend/database/migrations/versions"]
